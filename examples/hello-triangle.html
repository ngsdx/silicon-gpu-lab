<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SILICON — Hello Triangle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #090a0b; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", { alpha: false });
  if (!gl) throw new Error("WebGL2 required");

  const vs = `#version 300 es
  layout(location=0) in vec2 aPos;
  layout(location=1) in vec3 aCol;
  out vec3 vCol;
  void main() {
    vCol = aCol;
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec3 vCol;
  out vec4 frag;
  void main() { frag = vec4(vCol, 1.0); }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

  const vao = gl.createVertexArray();
  const vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
     0.00,  0.64,  0.93, 0.27, 0.27,
    -0.70, -0.54,  0.27, 0.84, 0.40,
     0.70, -0.54,  0.30, 0.42, 0.93,
  ]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 20, 8);

  function frame() {
    const dpr = Math.min(devicePixelRatio, 2);
    const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.035, 0.039, 0.043, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
